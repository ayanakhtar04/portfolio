<!DOCTYPE html>
<html lang="en" class="dark ws-mode">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Title, description, canonical, social cards, icons and structured
         data are written in by the seo-head plugin (vite.config.js) from
         site.config.js. -->
    <style>
      /* The pre-rendered intro paints in its stage position (html.ws-mode).
         With reduced motion the page becomes a plain document once the script
         runs, so until then the copy stays hidden to avoid a jump. */
      @media (prefers-reduced-motion: reduce) { #root[data-prerendered] { visibility: hidden; } }

      /* Boot screen. Pure CSS: it plays and lifts away by itself in about one and a half
         seconds, with or without JavaScript, while the intro is already
         painted underneath. src/motion/bootScreen.js lets a click, key or
         scroll skip it and removes it afterwards. Transform and opacity only. */
      .boot {
        position: fixed; inset: 0; z-index: 200;
        display: grid; place-items: center; padding: 24px;
        background-color: #070a14; color: #eef2ff;
        background-image:
          linear-gradient(rgba(34, 211, 238, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(34, 211, 238, 0.045) 1px, transparent 1px);
        background-size: 48px 48px;
        background-position: center;
        font: 14px/1.7 'JetBrains Mono', ui-monospace, Consolas, monospace;
        animation: boot-lift 550ms cubic-bezier(0.76, 0, 0.24, 1) 0.95s forwards;
      }
      .boot-name { margin: 0 0 18px; font: 700 26px/1.1 Inter, system-ui, sans-serif; letter-spacing: -0.02em; animation: boot-line 260ms ease 0.05s both; }
      .boot-name span { display: block; margin-top: 6px; font: 500 14px/1.4 Inter, system-ui, sans-serif; letter-spacing: 0; color: #22d3ee; }
      .boot-meta { display: flex; justify-content: space-between; margin-bottom: 8px; color: #aeb8d6; font-size: 13px; }
      @property --boot-p { syntax: '<integer>'; inherits: false; initial-value: 0; }
      .boot-pct { color: #bef264; counter-reset: p var(--boot-p); animation: boot-count 0.75s cubic-bezier(0.45, 0, 0.35, 1) 0.1s forwards; }
      .boot-pct::after { content: counter(p) '%'; }
      @keyframes boot-count { to { --boot-p: 100; } }
      .boot-inner { width: min(30rem, 100%); animation: boot-fade 300ms ease 0.88s forwards; }
      .boot-mark { display: block; width: 56px; height: 56px; margin-bottom: 22px; animation: boot-pop 500ms cubic-bezier(0.2, 0.9, 0.25, 1.2) both; }
      .boot-cmd { margin: 0 0 14px; color: #aeb8d6; white-space: nowrap; overflow: hidden; }
      .boot-cmd b { color: #22d3ee; font-weight: 400; }
      .boot-cmd span { color: #eef2ff; }
      .boot-cmd i { display: inline-block; width: 0.6em; height: 1.1em; margin-left: 2px; vertical-align: text-bottom; background: #22d3ee; animation: boot-blink 0.8s steps(1) infinite; }
      .boot-log { margin: 0 0 20px; padding: 0; list-style: none; color: #aeb8d6; }
      .boot-log li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; animation: boot-line 200ms ease forwards; }
      .boot-log li:nth-child(1) { animation-delay: 0.18s; }
      .boot-log li:nth-child(2) { animation-delay: 0.31s; }
      .boot-log li:nth-child(3) { animation-delay: 0.44s; }
      .boot-log li:nth-child(4) { animation-delay: 0.57s; }
      .boot-log li:nth-child(5) { animation-delay: 0.70s; }
      .boot-ok { color: #34d399; }
      .boot-log strong { color: #eef2ff; font-weight: 400; }
      .boot-bar { height: 4px; border-radius: 4px; background: #151d36; overflow: hidden; }
      .boot-bar span { display: block; height: 100%; background: #bef264; transform: scaleX(0); transform-origin: left; animation: boot-fill 0.75s cubic-bezier(0.45, 0, 0.35, 1) 0.1s forwards; }
      .boot.is-skip { animation: boot-skip 260ms ease forwards; }
      @keyframes boot-lift { to { transform: translateY(-100%); visibility: hidden; } }
      @keyframes boot-skip { to { opacity: 0; visibility: hidden; } }
      @keyframes boot-fade { to { opacity: 0; transform: translateY(-12px); } }
      @keyframes boot-pop { from { opacity: 0; transform: scale(0.6) rotate(-8deg); } }
      @keyframes boot-line { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
      @keyframes boot-fill { to { transform: scaleX(1); } }
      @keyframes boot-blink { 50% { opacity: 0; } }
      /* The intro and dock make their entrance as the boot screen lifts (the
         boot screen is in every first load, so plain delays: a :has(#boot)
         rule would restyle the whole page when the screen is removed; the html
         prefix outweighs the stylesheet's own delays). */
      html .hero-load.is-ready > * { animation-delay: calc(1s + var(--i, 0) * 90ms); }
      html .hero-load .hero-load > * { animation-delay: calc(1.1s + var(--i, 0) * 80ms); }
      html .linux-dock { animation-delay: 1.2s; }
      @media (max-width: 480px) { .boot { font-size: 12.5px; } }
      @media (prefers-reduced-motion: reduce) {
        .boot, .boot-inner, .boot-mark, .boot-name, .boot-log li, .boot-bar span, .boot-cmd i, .boot-pct { animation: none; }
        .boot-pct { --boot-p: 100; }
        .boot-log li { opacity: 1; }
        .boot-bar span { transform: none; }
        .boot { animation: boot-skip 250ms ease 0.4s forwards; }
      }
    </style>
    <noscript>
      <style>
        /* Without JavaScript: every section shown as a normal scrolling page. */
        #root[data-prerendered] { visibility: visible !important; }
        html.ws-mode .ws-scene { position: static !important; visibility: visible !important; }
        html.ws-mode .ws-window { position: static !important; transform: none !important; width: auto !important; height: auto !important; margin: 0 auto 6rem !important; }
        html.ws-mode .ws-body { height: auto !important; display: block !important; overflow: visible !important; }
        html.ws-mode .deck { grid-template-columns: minmax(0, 1fr) !important; }
        html.ws-mode .deck-side { display: none !important; }
        html.ws-mode .deck-stage { gap: 20px; }
        html.ws-mode .deck-card { grid-area: auto !important; }
        #boot { display: none; }
      </style>
    </noscript>
  </head>
  <body class="antialiased">
    <div id="boot" class="boot" aria-hidden="true">
      <div class="boot-inner">
        <svg class="boot-mark" viewBox="0 0 64 64" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <rect width="64" height="64" rx="14" fill="#0e1426" stroke="none" />
          <path d="M17 21 L31 32 L17 43" stroke="#22d3ee" stroke-width="6.5" />
          <path d="M35 44 H48" stroke="#bef264" stroke-width="6.5" />
        </svg>
        <p class="boot-name">Ayan Akhtar<span>DevOps &amp; Cloud Engineer</span></p>
        <p class="boot-cmd"><b>ayan@udaipur:~$</b> <span>./start --portfolio</span><i></i></p>
        <ul class="boot-log">
          <li><span class="boot-ok">[  OK  ]</span> Mounted <strong>/home/ayan</strong></li>
          <li><span class="boot-ok">[  OK  ]</span> Provisioned <strong>terraform apply</strong></li>
          <li><span class="boot-ok">[  OK  ]</span> Started <strong>docker compose up</strong></li>
          <li><span class="boot-ok">[  OK  ]</span> Passed <strong>CI pipeline in under 3 min</strong></li>
          <li><span class="boot-ok">[  OK  ]</span> Reached target <strong>portfolio.service</strong></li>
        </ul>
        <div class="boot-meta"><span>Deploying portfolio</span><span class="boot-pct"></span></div>
        <div class="boot-bar"><span></span></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
